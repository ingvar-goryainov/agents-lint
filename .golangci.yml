version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofumpt
